openapi: 3.0.0
info:
  title: "AllTrails Users RESTful API"
  version: 1.0.0

servers:
  - url: "/profileservice-api"

# add security
security:
  - basicAuth: []

components:
  schemas:
    Users:
      type: object
    Admin:
      type: object
    CreateUserSchema:
      type: object
      description: Schema for creating a new user account.
      properties:
        username:
          type: string
          description: "Username of the user."
          example: "John Doe"
        email:
          type: string
          description: "Email of the user."
          example: "john@plymouth.ac.uk"
        password:
          type: string
          description: "Password for the user account."
    UpdateAccountSchema:
      type: object
      description: Schema for updating user account details.
      properties:
        username:
          type: string
          description: "Username of the user."
        email:
          type: string
          description: "Email of the user."
        password:
          type: string
          description: "Password for the user account."
        first_name:
          type: string
          description: "First name of the user."
        last_name:
          type: string
          description: "Last name of the user."
        dob:
          type: string
          format: date
          description: "Date of birth."
          example: "1990-01-01"
        phone_no:
          type: integer
          description: "Phone number."
        height:
          type: number
          format: double
          description: "Height in cm."
        weight:
          type: number
          format: double
          description: "Weight in kg."
        about_me:
          type: string
          description: "About me bio."
        saved_trail_id:
          type: integer
          description: "ID of a saved trail."
        marketing_language:
          type: string
          description: "Preferred marketing language."
        preferred_unit_metric:
          type: string
          description: "Preferred unit metric (metric/imperial)."
        time_preference_speed:
          type: string
          description: "Time preference for speed."
    UpdateLocationSchema:
      type: object
      description: Validation schema for updating user location.
      properties:
        location:
          type: string
          description: "Location name, following format 'City, County, Country'"
          example: "Plymouth, Devon, UK"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      x-basicInfoFunc: authenticator.authenticate_user
  parameters:
    email:
      name: email
      description: "User's email"
      in: path
      required: true
      schema:
        type: string
    password:
      name: password
      description: "User's password"
      in: path
      required: true
      schema:
        type: string

paths:
  /user:
    get:
      operationId: python_endpoints.user.getUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Show profile of a general user"
      responses:
        "200":
          description: "User profile retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                description: User profile data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Error occurred locating user"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    post:
      operationId: python_endpoints.user.createNewUser
      # No security required - users can create accounts without authentication
      security: []
      tags:
        - Users
      summary: "Create a account for new user"
      requestBody:
        description: "User to create"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserSchema"
      responses:
        "201":
          description: "Account created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account created"
        "400":
          description: Invalid data input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "409":
          description: Conflict (username or email already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: "Username already taken"

    put:
      operationId: python_endpoints.user.updateUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Update account details of the user"
      requestBody:
        description: "Updated user data"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountSchema"
      responses:
        "200":
          description: "User account updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User account updated successfully"
        "400":
          description: Invalid data input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Username or email already taken"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    delete:
      operationId: python_endpoints.user.deleteUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: Delete this user account
      responses:
        "404":
          description: Could not find this user to delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: "Access denied"
        "204":
          description: User deleted successfully          

  /user/activities/{activity_name}:
    put:
      operationId: python_endpoints.user.addActivity
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Add an activity to user's profile"
      parameters:
        - name: activity_name
          in: path
          required: true
          schema:
            type: string
          description: "Name of the activity to add"
      responses:
        "201":
          description: "Activity added successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: "User not found or Activity not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "User already has this activity"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "401":
          description: "Credentials not found or invalid"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /user/location/{location}:
    put:
      operationId: python_endpoints.user.updateUserOwnLocation
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Update user's location"
      parameters:
        - name: location
          in: path
          required: true
          schema:
            type: string
          description: "Name of the location to set for the user"
      responses:
        "200":
          description: "User's location updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Could not find this user to update location or Location does not exist"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string                  

  /admin/accounts:
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.getAllUsers
      tags:
        - Admin (User management)
      summary: "Show all user accounts"
      responses:
        "200":
          description: "Successfully retrieved all user accounts"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: User account data
        "401":
          description: "Unauthorised access or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    post:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.createUserAccount
      tags:
        - Admin (User management)
      summary: "Create a account for new general user"
      requestBody:
        description: "User credentials to create account from"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserSchema"
      responses:
        "201":
          description: "User account created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User account created successfully"
        "400":
          description: Invalid data input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "409":
          description: Conflict (username or email already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: "Username already taken"                
    
  /admin/accounts/{user_email}:                      
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.getSpecificUser
      tags:
        - Admin (User management)
      summary: "Show a specific user account by email"
      parameters:
        - name: user_email
          in: path
          required: true
          schema:
            type: string
          description: "Email of the user to retrieve their profile"
      responses:
        "200":
          description: "Successfully retrieved the user account"
          content:
            application/json:
              schema:
                type: object
                description: Specific user's account data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found or Admin not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    delete:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.deleteGeneralUser
      tags:
        - Admin (User management)
      summary: "Delete a specific general user account by email"
      parameters:
        - name: user_email
          in: path
          required: true
          schema:
            type: string
          description: "Email of the user to delete their account"
      responses:
        "204":
          description: "User deleted successfully"
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found or Admin not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    put:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.performProfileUpdate
      tags:
        - Admin (User management)
      summary: "Update a specific general user account by email"
      parameters:
        - name: user_email
          in: path
          required: true
          schema:
            type: string
          description: "Email of the user to update their account"
      requestBody:
        description: "Updated user data"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountSchema"
      responses:
        "200":
          description: "User account updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User account updated successfully"
        "400":
          description: "Invalid data input"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found or Admin not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Username or email already taken"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string       

  /admin/locations/{new_location}:
    post:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.addNewLocation
      tags:
        - Admin (Locations management)
      summary: "Add a new location to the database"
      parameters:
        - name: new_location
          in: path
          required: true
          schema:
            type: string
          description: "Name of the new location to add"
      responses:
        "201":
          description: "Location added successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: "Invalid location format"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Location already exists"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/locations: 
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.showAllLocations
      tags:
        - Admin (Locations management)
      summary: "Retrieve all locations from the database"
      responses:
        "200":
          description: "Successfully retrieved all locations"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Location data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "No locations found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/locations/{old_location_name}/{new_location_name}:
    put:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.updateExistingLocation
      tags:
        - Admin (Locations management)
      summary: "Update an existing location's name"
      parameters:
        - name: old_location_name
          in: path
          required: true
          schema:
            type: string
          description: "Current name of the location to update"
        - name: new_location_name
          in: path
          required: true
          schema:
            type: string
          description: "New name for the location"
      responses:
        "200":
          description: "Location updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: "Invalid location format"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Location not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/locations/{location_name}:
    delete:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.deleteLocation
      tags:
        - Admin (Locations management)
      summary: "Delete a location from the database"
      parameters:
        - name: location_name
          in: path
          required: true
          schema:
            type: string
          description: "Name of the location to delete"
      responses:
        "200":
          description: "Location deleted successfully"
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Location not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "400":
          description: "Invalid location format"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Cannot delete location as it is assigned to one or more users"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/activities/{activity_name}:
    post:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.addNewActivity
      tags:
        - Admin (Activities management)
      summary: "Add a new activity to the database"
      parameters:
        - name: activity_name
          in: path
          required: true
          schema:
            type: string
          description: "Name of the new activity to add"
      responses:
        "201":
          description: "Activity added successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Activity already exists"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string                   

  /admin/activities:
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.showAllActivities
      tags:
        - Admin (Activities management)
      summary: "Retrieve all activities from the database"
      responses:
        "200":
          description: "Successfully retrieved all activities"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Activity data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "No activities found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string                   

  /admin/activities/{old_activity_name}/{new_activity_name}:
    put:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.updateExistingActivity
      tags:
        - Admin (Activities management)
      summary: "Update an existing activity"
      parameters:
        - name: old_activity_name
          in: path
          required: true
          schema:
            type: string
          description: "Current name of the activity to update"
        - name: new_activity_name
          in: path
          required: true
          schema:
            type: string
          description: "New name/details for the activity"
      responses:
        "200":
          description: "Activity updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Activity not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Activity with new name/details already exists"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/activities/{activity_to_delete}:
    delete:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.deleteActivity
      tags:
        - Admin (Activities management)
      summary: "Delete an activity from the database"
      parameters:
        - name: activity_to_delete
          in: path
          required: true
          schema:
            type: string
          description: "Name of the activity to delete"
      responses:
        "200":
          description: "Activity deleted successfully"
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Activity not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Cannot delete activity as it is associated with users"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string 

  /admin/user-activities: 
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.showUserActivityAssociations
      tags:
        - Admin (Activities management)
      summary: "Retrieve all user-activity associations from the database"
      responses:
        "200":
          description: "Successfully retrieved all user-activity associations"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: User-Activity association data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "No user-activity associations found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/user-saved-trails/{user_email}:
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.getUserSavedTrails
      tags:
        - Admin (Saved Trails management)
      summary: "Retrieve all saved trails for a specific user by email"
      parameters:
        - name: user_email
          in: path
          required: true
          schema:
            type: string
          description: "Email of the user to retrieve their saved trails"
      responses:
        "200":
          description: "Successfully retrieved user's saved trails"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: User's saved trail data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found or No saved trails found for this user"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string