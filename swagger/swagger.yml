openapi: 3.0.0
info:
  title: "AllTrails Users RESTful API"
  version: 1.0.0

servers:
  - url: "/profileservice-api1"

# add security
security:
  - basicAuth: []

components:
  schemas:
    Users:
      type: object
    Admin:
      type: object
    CreateUserSchema:
      type: object
      description: Schema for creating a new user account.
      properties:
        username:
          type: string
          description: "Username of the user."
          example: "John Doe"
        email:
          type: string
          description: "Email of the user."
          example: "john@plymouth.ac.uk"
        password:
          type: string
          description: "Password for the user account."
    UpdateAccountSchema:
      type: object
      description: Schema for updating user account details.
      properties:
        username:
          type: string
          description: "Username of the user."
        email:
          type: string
          description: "Email of the user."
        password:
          type: string
          description: "Password for the user account."
        first_name:
          type: string
          description: "First name of the user."
        last_name:
          type: string
          description: "Last name of the user."
        dob:
          type: string
          format: date
          description: "Date of birth."
        phone_no:
          type: integer
          description: "Phone number."
        height:
          type: number
          format: double
          description: "Height in cm."
        weight:
          type: number
          format: double
          description: "Weight in kg."
        about_me:
          type: string
          description: "About me bio."
        marketing_language:
          type: string
          description: "Preferred marketing language."
        preferred_unit_metric:
          type: string
          description: "Preferred unit metric (metric/imperial)."
        time_preference_speed:
          type: string
          description: "Time preference for speed."
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      x-basicInfoFunc: authenticator.authenticate_user
  parameters:
    email:
      name: email
      description: "User's email"
      in: path
      required: true
      schema:
        type: string
    password:
      name: password
      description: "User's password"
      in: path
      required: true
      schema:
        type: string

paths:
  /user:
    get:
      operationId: python_endpoints.user.getUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Show profile of a general user"
      responses:
        "200":
          description: "User profile retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                description: User profile data
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "Error occurred locating user"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    post:
      operationId: python_endpoints.user.createNewUser
      # No security required - users can create accounts without authentication
      security: []
      tags:
        - Users
      summary: "Create a account for new user"
      requestBody:
        description: "User to create"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserSchema"
      responses:
        "201":
          description: "Account created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account created"
        "400":
          description: Invalid data input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "409":
          description: Conflict (username or email already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: "Username already taken"

    put:
      operationId: python_endpoints.user.updateUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Update account details of the user"
      requestBody:
        description: "Updated user data"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountSchema"
      responses:
        "200":
          description: "User account updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User account updated successfully"
        "400":
          description: Invalid data input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: object
                    description: Validation error messages from schema
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "Username or email already taken"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

    delete:
      operationId: python_endpoints.user.deleteUser
      security:
        - basicAuth: []
      tags:
        - Users
      summary: Delete this user account
      responses:
        "404":
          description: Could not find this user to delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "401":
          description: "Access denied or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: "Access denied"
        "204":
          description: User deleted successfully          

  /user/activities/{activity_name}:
    put:
      operationId: python_endpoints.user.addActivity
      security:
        - basicAuth: []
      tags:
        - Users
      summary: "Add an activity to user's profile"
      parameters:
        - name: activity_name
          in: path
          required: true
          schema:
            type: string
          description: "Name of the activity to add"
      responses:
        "201":
          description: "Activity added successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: "User not found or Activity not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "409":
          description: "User already has this activity"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "401":
          description: "Credentials not found or invalid"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string

  /admin/accounts:
    get:
      security:
        - basicAuth: []
      operationId: python_endpoints.administrator.getAllUsers
      tags:
        - Admin
      summary: "Show all user accounts"
      responses:
        "200":
          description: "Successfully retrieved all user accounts"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: User account data
        "401":
          description: "Unauthorised access or credentials not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string        